name: selftest

on:
  push:
    branches: [ main, master ]
  pull_request:
  schedule:
    - cron: '0 3 * * *'   # daily: full run (incl. network integration tests)

jobs:
  unit:
    # Fast, offline, 100% stable — network flakes can never turn this red.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build src/AuroraLauncher.Desktop/AuroraLauncher.Desktop.csproj -c Debug
      - name: Unit tests (offline)
        run: dotnet run --project tests/AuroraSelfTest -c Debug --no-build -- --unit

  integration:
    # Optional / scheduled: hits real endpoints (Mojang, BMCLAPI, Fabric meta).
    runs-on: windows-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build src/AuroraLauncher.Desktop/AuroraLauncher.Desktop.csproj -c Debug
      - name: Full tests (network integration)
        run: dotnet run --project tests/AuroraSelfTest -c Debug --no-build -- --all
      - name: Open issue on failure (scheduled runs have no PR to alert)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[integration] 每日全量自测失败 (${new Date().toISOString().slice(0, 10)})`,
              body: '每日定时的网络集成测试失败。查看 Actions 日志定位是网络环境还是代码退化；对比 TEST_RESULTS.md 里的"上次全绿时间"。',
              labels: ['ci', 'integration']
            })
