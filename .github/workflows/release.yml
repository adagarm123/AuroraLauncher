name: Release Launcher

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest 
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Unit Tests
        run: dotnet run --project tests/AuroraSelfTest -c Release -- --unit

      - name: Publish EXE
        run: powershell -ExecutionPolicy Bypass -File scripts/publish.ps1

      - name: Generate signed latest.json
        env:
          RSA_PRIVATE_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
        run: |
          $DownloadUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AuroraLauncher.exe"
          powershell -ExecutionPolicy Bypass -File scripts/sign-release.ps1 -DownloadUrl $DownloadUrl
          if (-not (Test-Path "publish/latest.json")) {
              Write-Error "Error: latest.json not generated"
              exit 1
          }

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/AuroraLauncher.exe
            publish/build-info.txt
            publish/latest.json

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/ 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4