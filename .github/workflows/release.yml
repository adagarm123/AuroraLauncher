name: Release Launcher

on:
  push:
    tags:
      - 'v*' # 只有当你推送类似 v1.0.0 的标签时才会触发

jobs:
  release:
    runs-on: windows-latest 
    permissions:
      contents: write # 允许 Action 创建 Release 并上传文件

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' 

      - name: 运行单元测试
        run: dotnet run --project tests/AuroraSelfTest -c Release -- --unit

      - name: 执行发布脚本
        run: powershell -ExecutionPolicy Bypass -File scripts/publish.ps1

      - name: 创建 Release 并上传 EXE
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/AuroraLauncher.exe
            publish/build-info.txt