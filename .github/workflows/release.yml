name: Release Launcher

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest 
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Unit Tests
        run: dotnet run --project tests/AuroraSelfTest -c Release -- --unit

      # Round-107: CI checks out a clean tree, so publish.ps1 used to find no
      # previous EXE and silently produced a full-package-only manifest. Fetch
      # the last published EXE from GitHub Releases so the SAME local patch
      # path runs on CI: users one round behind then get a ~1 % delta instead
      # of a 65 MB download. Multi-round-behind clients still get the full
      # package (patchFromRound only matches one exact round) — by design.
      - name: Fetch previous release EXE for delta patch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $current = "${{ github.ref_name }}"
          $releases = gh api "repos/$repo/releases?per_page=10" | ConvertFrom-Json
          $prev = $releases | Where-Object {
            $_.tag_name -ne $current -and -not $_.draft -and -not $_.prerelease -and
            ($_.assets | Where-Object { $_.name -eq 'AuroraLauncher.exe' })
          } | Select-Object -First 1
          if (-not $prev) {
            Write-Host "No previous release with an EXE - full package only."
            exit 0
          }
          New-Item -ItemType Directory -Force -Path artifacts\prev, publish | Out-Null
          $prevTag = $prev.tag_name
          gh release download $prevTag --repo $repo --pattern AuroraLauncher.exe --dir artifacts\prev --clobber
          gh release download $prevTag --repo $repo --pattern build-info.txt --dir artifacts\prev --clobber
          # publish.ps1 reads publish/.last-round to decide from which round
          # the patch is built; write it from that release's own build-info.
          $infoPath = Join-Path (Get-Location) "artifacts\prev\build-info.txt"
          $prevRound = 0
          if (Test-Path $infoPath) {
            $txt = Get-Content $infoPath -Raw
            if ($txt -match 'round\s*:\s*(\d+)') { $prevRound = [int]$Matches[1] }
          }
          if ($prevRound -le 0) {
            Write-Warning "Cannot read previous round from $prevTag - full package only."
            Remove-Item (Join-Path (Get-Location) 'artifacts\prev\AuroraLauncher.exe') -ErrorAction SilentlyContinue
            exit 0
          }
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'publish\.last-round'), "$prevRound")
          Write-Host "Previous build: $prevTag, round $prevRound -> artifacts\prev"

      - name: Publish EXE
        run: powershell -ExecutionPolicy Bypass -File scripts/publish.ps1

      - name: Generate signed latest.json
        env:
          RSA_PRIVATE_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
          CNB_REPO: ${{ secrets.CNB_REPO }}
        run: |
          # Round-108: CNB is the primary (fast in CN); GitHub is the signed
          # fallback. Both hosts serve byte-identical assets from this build.
          $GitHubUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AuroraLauncher.exe"
          if ($env:CNB_REPO) {
              $CnbUrl = "https://cnb.cool/$env:CNB_REPO/-/releases/download/${{ github.ref_name }}/AuroraLauncher.exe"
              powershell -ExecutionPolicy Bypass -File scripts/sign-release.ps1 -DownloadUrl $CnbUrl -FallbackUrl $GitHubUrl
          }
          else {
              # No CNB configured: GitHub-only, exactly as before.
              powershell -ExecutionPolicy Bypass -File scripts/sign-release.ps1 -DownloadUrl $GitHubUrl
          }
          if (-not (Test-Path "publish/latest.json")) {
              Write-Error "Error: latest.json not generated"
              exit 1
          }

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          # Round-74: the delta patch lives on the release, not only in the Pages
          # artifact — clients fetch it from the same releases/download base URL.
          files: |
            publish/AuroraLauncher.exe
            publish/AuroraLauncher.patch
            publish/build-info.txt
            publish/latest.json

      # Round-108: mirror the same four assets to CNB (cnb.cool) so Chinese
      # users get the primary download from a domestic host; the signed
      # fallbackUrl in latest.json keeps GitHub as a reliability hedge.
      - name: Mirror assets to CNB Release
        env:
          CNB_REPO: ${{ secrets.CNB_REPO }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          if (-not $env:CNB_REPO -or -not $env:CNB_TOKEN) {
              Write-Host "CNB secrets not configured - skipping mirror (GitHub-only release)."
              exit 0
          }
          Write-Host "Mirroring to CNB repo: $env:CNB_REPO, tag: ${{ github.ref_name }}"
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
              -NoProfile -ExecutionPolicy Bypass -File scripts/publish-to-cnb.ps1 `
              -Tag "${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { throw "CNB mirror failed with exit $LASTEXITCODE" }

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/

      # Round-105: deploy-pages@v4 resolves the "github-pages" artifact by
      # name within ~1 s of upload. GitHub's artifact metadata index can lag
      # several seconds, so that lookup intermittently fails with
      # "No artifacts named github-pages were found" even though the upload
      # succeeded. Poll the artifact list until the name is visible (or time
      # out with a clear message) before handing off to the deploy action.
      - name: Wait for Pages artifact metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $runId = "${{ github.run_id }}"
          # The public artifact list may show the name immediately while the
          # internal runtime metadata endpoint deploy-pages uses is still
          # catching up — give it a fixed buffer before polling.
          Start-Sleep -Seconds 15
          $deadline = (Get-Date).AddMinutes(3)
          $visible = $false
          while ((Get-Date) -lt $deadline) {
            $json = gh api "repos/$repo/actions/runs/$runId/artifacts" 2>$null
            if ($LASTEXITCODE -eq 0 -and $json) {
              $list = $json | ConvertFrom-Json
              if ($list.artifacts | Where-Object { $_.name -eq 'github-pages' }) {
                Write-Host "Pages artifact metadata visible; proceeding to deploy."
                $visible = $true
                break
              }
            }
            Start-Sleep -Seconds 5
          }
          if (-not $visible) {
            Write-Error "Pages artifact metadata did not become visible within 3 minutes."
            exit 1
          }

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4